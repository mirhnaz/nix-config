# Weekly `nix flake update`, opened as a PR and merged if the checks pass.
#
# The PR is opened by github-actions[bot], so a check.yml run on it would be
# held for manual approval ("first-time contributor"). check.yml therefore
# ignores lock-only PRs, and this job runs the same checks itself, after
# updating the lock and before opening the PR — a PR only appears if the new
# inputs pass, and is then merged by this job. That merge is pushed with
# GITHUB_TOKEN, which never triggers other workflows, so check.yml does not
# run again on main; the checks here are the only gate. Keep the lists below
# in step with the matrices in check.yml.
#
# Repo setting required once: Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".
name: update-flake

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update flake inputs
        run: nix flake update

      - name: Check the updated inputs evaluate
        run: |
          set -euo pipefail
          nix fmt -- --ci
          nix flake show
          for host in mir-nixos-pc; do
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"; echo
          done
          for name in \
            mir@mir-nixos-pc \
            mir@mir-nixos-thinkpad \
            mir@mir-popos-thinkpad \
            mir@mir-omarchy-pc \
            mir@mir-m4pro-mbp \
            nazishhussainmir@K-H-2005735-M; do
            nix eval --raw ".#homeConfigurations.\"${name}\".activationPackage.drvPath"; echo
          done

      - name: Summarise input changes
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Automated `nix flake update`. All outputs were evaluated (fmt, flake show, every host/home drvPath) before this PR was opened.'
            echo
            echo '```'
            git diff --stat -- flake.lock
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        id: pr
        with:
          branch: update-flake-lock
          delete-branch: true
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: ${{ steps.summary.outputs.body }}

      # The checks above already passed on exactly this tree, so merge straight
      # away. No-op when the lock didn't change (no PR number).
      - name: Merge the PR
        if: steps.pr.outputs.pull-request-number != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --merge --delete-branch
