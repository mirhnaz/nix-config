# Weekly `nix flake update`, opened as a PR.
#
# PRs created with the default GITHUB_TOKEN do not trigger other workflows,
# so check.yml would NOT run on the PR. Instead this job runs the same
# checks itself, after updating the lock and before opening the PR — a PR
# only appears if the new inputs pass. Keep the lists below in step with
# the matrices in check.yml.
#
# Repo setting required once: Settings → Actions → General → Workflow
# permissions → "Allow GitHub Actions to create and approve pull requests".
name: update-flake

on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: DeterminateSystems/nix-installer-action@main
      - uses: DeterminateSystems/magic-nix-cache-action@main

      - name: Update flake inputs
        run: nix flake update

      - name: Check the updated inputs evaluate
        run: |
          set -euo pipefail
          nix fmt -- --ci
          nix flake show
          for host in mir-nixos-pc; do
            nix eval --raw ".#nixosConfigurations.${host}.config.system.build.toplevel.drvPath"; echo
          done
          for name in \
            mir@mir-nixos-pc \
            mir@mir-nixos-thinkpad \
            mir@mir-popos-thinkpad \
            mir@mir-omarchy-pc \
            mir@mir-m4pro-mbp \
            nazishhussainmir@K-H-2005735-M; do
            nix eval --raw ".#homeConfigurations.\"${name}\".activationPackage.drvPath"; echo
          done

      - name: Summarise input changes
        id: summary
        run: |
          {
            echo 'body<<EOF'
            echo 'Automated `nix flake update`. All outputs were evaluated (fmt, flake show, every host/home drvPath) before this PR was opened.'
            echo
            echo '```'
            git diff --stat -- flake.lock
            echo '```'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - uses: peter-evans/create-pull-request@v7
        with:
          branch: update-flake-lock
          delete-branch: true
          commit-message: "flake.lock: update inputs"
          title: "flake.lock: update inputs"
          body: ${{ steps.summary.outputs.body }}
